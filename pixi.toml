[workspace]
authors = ["harshit <harshit2k19@gmail.com>"]
channels = ["conda-forge"]
name = "model_train_basics"
platforms = [
    { name = "linux-gpu", platform = "linux-64", cuda = "13.2" },
    { name = "linux-cpu", platform = "linux-64" },
]
version = "0.1.0"

[tasks]

[dependencies]
python = "3.12.*"
ruff = ">=0.17.1,<0.18"
pytest = ">=9.1.1,<10"
pyyaml = ">=6.0.3,<7"

[feature.gpu]
platforms = ["linux-gpu"]

[feature.gpu.pypi-dependencies]
torch = { version = ">=2.7,<3", index = "https://download.pytorch.org/whl/cu132" }
transformers = ">=4.51,<5"
ipykernel = ">=6,<8"

[feature.cpu]
platforms = ["linux-cpu"]

[feature.cpu.pypi-dependencies]
torch = { version = ">=2.7,<3", index = "https://download.pytorch.org/whl/cpu" }
transformers = ">=4.51,<5"

[environments]
gpu = ["gpu"]
cpu = ["cpu"]

[pypi-dependencies]
pydantic = ">=2.14.1, <3"
