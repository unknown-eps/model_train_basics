repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: Ruff format
        entry: pixi run -e gpu ruff format
        language: system
        types: [python]
      - id: pytest
        name: Pytest (full test suite)
        entry: pixi run -e gpu python -m pytest tests -q
        language: system
        pass_filenames: false
        always_run: true
